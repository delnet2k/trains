<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Car Streaming</title>
<style>
  /* Launcher for the Tesla browser: one bookmark, big tap targets. Self-contained so it loads fast in the car. */
  :root { --bg: #f6f2ef; --tile: #ffffff; --ink: #211d1b; --muted: #6b625d; --edge: #e4dcd6; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161312; --tile: #241f1d; --ink: #f4eeea; --muted: #a89d97; --edge: #352e2b; --accent: #fb923c; }
  }
  :root[data-theme="dark"] { --bg: #161312; --tile: #241f1d; --ink: #f4eeea; --muted: #a89d97; --edge: #352e2b; --accent: #fb923c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { margin: 0 0 20px; font-size: 26px; font-weight: 650; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  a.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 170px; padding: 20px;
           background: var(--tile); border: 1px solid var(--edge); border-radius: 16px; color: inherit; text-decoration: none; }
  a.tile:active { transform: scale(.98); border-color: var(--accent); }
  .logo { width: 96px; height: 96px; border-radius: 22px; object-fit: cover; display: block; }
  .name { font-size: 22px; font-weight: 650; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Watch</h1>
  <div class="grid" id="grid"></div>
</main>
<script>
  // Edit this list to add or remove services: name, link, logo file in img/.
  var SERVICES = [
    ['Netflix', 'https://www.netflix.com/', 'netflix.jpg'],
    ['Prime Video', 'https://www.primevideo.com/', 'primevideo.png'],
    ['Disney+', 'https://www.disneyplus.com/', 'disneyplus.png'],
    ['Apple TV', 'https://tv.apple.com/', 'appletv.png'],
    ['YouTube', 'https://www.youtube.com/', 'youtube.png'],
    ['BBC iPlayer', 'https://www.bbc.co.uk/iplayer', 'iplayer.png'],
    ['ITVX', 'https://www.itv.com/', 'itv.png'],
    ['Channel 4', 'https://www.channel4.com/', 'channel4.png'],
    ['NOW', 'https://www.nowtv.com/watch/home', 'nowtv.png'],
    ['Paramount+', 'https://www.paramountplus.com/gb/', 'paramountplus.jpg'],
    ['HBO Max', 'https://www.hbomax.com/', 'hbomax.jpg']
  ];
  document.getElementById('grid').innerHTML = SERVICES.map(function (s) {
    return '<a class="tile" href="' + s[1] + '"><img class="logo" src="img/' + s[2] + '" alt=""><span class="name">' + s[0] + '</span></a>';
  }).join('');
</script>
</body>
</html>
